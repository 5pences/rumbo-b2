<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rumbo B2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: sticky header with section tabs (bottom tab bar on phones), one reading column up to 980px,
   study cards centred at 640px. Spanish is always set in the serif face, Chinese in the system sans. */
:root {
  --bg: #F1F4F9; --surface: #FFFFFF; --surface-2: #E7ECF5; --ink: #141C33; --muted: #58627F; --line: #D3DAE8;
  --accent: #1B46C4; --accent-soft: #E1E9FB; --on-accent: #FFFFFF;
  --sun: #E3A008; --sun-soft: #FBEFCB; --on-sun: #2B1F00;
  --good: #15774C; --good-soft: #DBF1E5; --bad: #BC3328; --bad-soft: #FAE2DF;
  --a1: #2586C4; --a2: #17937F; --b1: #C97F08; --b2: #C4443A;
  --font-display: "Bricolage Grotesque", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-es: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1322; --surface: #161F35; --surface-2: #1F2A45; --ink: #E7ECF7; --muted: #9AA6C2; --line: #2B3857;
    --accent: #86A6FF; --accent-soft: #1E2C55; --on-accent: #0D1322;
    --sun: #F3C344; --sun-soft: #3A3013; --on-sun: #2B1F00;
    --good: #5FD19B; --good-soft: #133527; --bad: #FF8E82; --bad-soft: #43201C;
    --a1: #5BB4EC; --a2: #45C4AE; --b1: #F0B040; --b2: #F2776B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1322; --surface: #161F35; --surface-2: #1F2A45; --ink: #E7ECF7; --muted: #9AA6C2; --line: #2B3857;
  --accent: #86A6FF; --accent-soft: #1E2C55; --on-accent: #0D1322;
  --sun: #F3C344; --sun-soft: #3A3013; --on-sun: #2B1F00;
  --good: #5FD19B; --good-soft: #133527; --bad: #FF8E82; --bad-soft: #43201C;
  --a1: #5BB4EC; --a2: #45C4AE; --b1: #F0B040; --b2: #F2776B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font-ui); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
.es { font-family: var(--font-es); }
.muted { color: var(--muted); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 20px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.brand b { background: var(--sun); color: var(--on-sun); padding: 0 6px; border-radius: 4px; font-weight: 700; }
.azulejo { height: 6px; background:
  linear-gradient(45deg, var(--accent) 25%, transparent 25% 75%, var(--accent) 75%) 0 0 / 12px 12px,
  linear-gradient(45deg, var(--sun) 25%, transparent 25% 75%, var(--sun) 75%) 6px 6px / 12px 12px, var(--surface); }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav a { padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"] i { background: var(--good); }
.sync[data-s="saving"] i, .sync[data-s="connecting"] i { background: var(--sun); }

.tabbar { display: none; }
main { max-width: 980px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 28px; }
.stack-s { display: flex; flex-direction: column; gap: 12px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@media (max-width: 720px) {
  .nav { display: none; }
  .top-in { justify-content: space-between; min-height: 48px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; }
  .tabbar a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  main { padding-block: 20px 96px; }
  h1 { font-size: 1.55rem; }
}

/* ---------- shared pieces ---------- */
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 600; line-height: 1.3; }
.btn:hover { border-color: var(--accent); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn-danger { color: var(--bad); }
.chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.lv { color: var(--on-accent); font-family: var(--font-display); }
.lv-A1 { background: var(--a1); } .lv-A2 { background: var(--a2); } .lv-B1 { background: var(--b1); } .lv-B2 { background: var(--b2); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 99px; font-weight: 600; color: var(--muted); font-size: 14px; }
.pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.field { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; min-width: 0; }
select.field { padding-right: 28px; }
.spk { border: 0; background: transparent; color: var(--accent); padding: 4px; border-radius: 6px; display: inline-flex; vertical-align: middle; flex: none; }
.spk:hover { background: var(--accent-soft); }
.spk svg { width: 20px; height: 20px; }
.no-tts .spk { display: none; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.subtabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.subtabs button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
.accents { display: flex; flex-wrap: wrap; gap: 4px; }
.accents button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-width: 32px; padding: 3px 0; font-family: var(--font-es); font-size: 16px; }
.accents button:hover { border-color: var(--accent); }
.ok { color: var(--good); } .no { color: var(--bad); }
.note-ok, .note-no { border-radius: 8px; padding: 10px 12px; }
.note-ok { background: var(--good-soft); } .note-no { background: var(--bad-soft); }

/* ---------- home ---------- */
.hero h1 .es { font-weight: 600; }
.route { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stop { padding: 18px 14px 0 0; border-top: 4px solid var(--c); position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stop::before { content: ""; position: absolute; top: -10px; left: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); }
.stop.done::before { background: var(--c); }
.stop-name { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; display: flex; align-items: baseline; gap: 8px; }
.stop-name small { font-family: var(--font-ui); font-size: 13px; color: var(--muted); font-weight: 600; }
.stop .meter i { background: var(--c); }
.stop-cap { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stop.here .stop-name::after { content: "当前"; font: 600 11px var(--font-ui); background: var(--c); color: var(--on-accent); padding: 1px 6px; border-radius: 4px; align-self: center; }
@media (max-width: 720px) {
  .route { grid-template-columns: 1fr; }
  .stop { border-top: 0; border-left: 4px solid var(--c); padding: 0 0 18px 18px; }
  .stop::before { top: 4px; left: -10px; }
}
.tasks { display: flex; flex-direction: column; }
.task { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task-n { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
.task.done .task-n { color: var(--good); }
.task-body { flex: 1; min-width: 0; }
.task-body b { display: block; }
.task-body span { color: var(--muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.fact b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; display: block; line-height: 1.2; font-variant-numeric: tabular-nums; }
.fact span { color: var(--muted); font-size: 13px; }
.week { display: flex; align-items: flex-end; gap: 8px; height: 96px; }
.week div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
.week i { display: block; width: 100%; max-width: 36px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.week .today i { background: var(--sun); }
.week span { font: 600 12px var(--font-es); color: var(--muted); }
details.guide summary { cursor: pointer; font-weight: 700; }
details.guide ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }

/* ---------- flashcards ---------- */
.study { max-width: 640px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.fc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; min-height: 320px; }
.fc-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fc-meta .count { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.fc-new { background: var(--sun-soft); color: var(--ink); }
.fc-front { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 10px 0; }
.fc-word { font-family: var(--font-es); font-size: clamp(1.7rem, 6vw, 2.5rem); font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.fc-word.zh { font-family: var(--font-ui); font-size: clamp(1.4rem, 5vw, 1.9rem); }
.fc-back { border-top: 1px dashed var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.fc-ans { font-size: 1.3rem; font-weight: 700; }
.fc-ans.es { font-size: 1.5rem; font-weight: 600; }
.fc-note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; text-align: left; font-size: 14px; }
.fc-ex { text-align: left; }
.fc-ex .es { font-size: 1.1rem; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grades button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; }
.grades small { font-weight: 500; color: var(--muted); font-size: 12px; }
.grades .g1 { color: var(--bad); } .grades .g3 { color: var(--good); } .grades .g4 { color: var(--accent); }
.grades button:hover { border-color: currentColor; }
.hint { text-align: center; color: var(--muted); font-size: 13px; }
@media (max-width: 720px) { .hint.keys { display: none; } }

/* ---------- lists ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters .field { flex: 1 1 140px; }
.words { list-style: none; margin: 0; padding: 0; }
.word { border-bottom: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 14px minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.word .st { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--line); align-self: center; }
.word .st.s1 { border-color: var(--sun); background: var(--sun); } .word .st.s2 { border-color: var(--good); background: var(--good); }
.word .w-es { font-family: var(--font-es); font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
.word .w-zh { overflow-wrap: anywhere; }
.word .w-ex { grid-column: 2 / -1; color: var(--muted); font-size: 14px; }
.word .w-ex .es { color: var(--ink); font-size: 1rem; }
.word .w-tags { display: flex; gap: 4px; align-items: center; }
@media (max-width: 560px) {
  .word { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .word .w-tags { grid-column: 3; grid-row: 1; }
  .word .w-zh { grid-column: 2 / -1; grid-row: 2; }
  .word .w-ex { grid-row: 3; }
}
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--line); }
.legend .s1 { border-color: var(--sun); background: var(--sun); } .legend .s2 { border-color: var(--good); background: var(--good); }

.phrase { border-bottom: 1px solid var(--line); padding: 14px 0; display: flex; flex-direction: column; gap: 4px; }
.phrase-head { display: flex; gap: 8px; align-items: flex-start; }
.phrase-head .es { font-size: 1.2rem; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.phrase .p-note { color: var(--muted); font-size: 14px; }
.phrase .p-ex { border-left: 3px solid var(--line); padding-left: 10px; margin-top: 4px; }
.phrase .p-ex .es { font-size: 1.05rem; }

/* ---------- grammar ---------- */
.lessons { list-style: none; margin: 0; padding: 0; }
.lesson { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: transparent; border-inline: 0; border-top: 0; }
.lesson:hover .l-title { color: var(--accent); }
.l-no { font-family: var(--font-display); font-weight: 700; color: var(--muted); min-width: 28px; font-variant-numeric: tabular-nums; }
.l-body { flex: 1; min-width: 0; }
.l-title { font-weight: 700; font-size: 1.05rem; display: block; }
.l-intro { color: var(--muted); font-size: 14px; display: block; }
.prose { max-width: 70ch; display: flex; flex-direction: column; gap: 12px; }
.prose h3 { font: 700 1.1rem var(--font-display); margin-top: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.prose .es { font-size: 1.06em; color: var(--accent); cursor: pointer; }
.no-tts .prose .es { cursor: auto; }
.prose table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 700; }
.table-scroll { overflow-x: auto; max-width: 100%; }
.examples { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 70ch; }
.examples li { display: flex; gap: 6px; align-items: flex-start; }
.examples .es { font-size: 1.12rem; display: block; }
.ex { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 70ch; }
.ex-q { font-family: var(--font-es); font-size: 1.2rem; }
.ex-q .blank { display: inline-block; min-width: 56px; border-bottom: 2px solid var(--accent); text-align: center; font-weight: 600; }
.ex-q .blank.ok { border-color: var(--good); } .ex-q .blank.no { border-color: var(--bad); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; text-align: left; font-family: var(--font-es); font-size: 1.08rem; }
.opt.zh { font-family: var(--font-ui); font-size: 1rem; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.fill-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fill-row .field { flex: 1 1 180px; font-family: var(--font-es); font-size: 1.1rem; }
.back { align-self: flex-start; }

/* ---------- verbs ---------- */
.vq { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.vq .v-inf { font-family: var(--font-es); font-size: 2.1rem; font-weight: 600; }
.vq .v-ask { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.vq .v-person { font-family: var(--font-es); font-size: 1.3rem; font-style: italic; }
.conj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.conj-t { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px; min-width: 0; }
.conj-t h3 { font: 700 15px var(--font-ui); margin-bottom: 6px; }
.conj-t h3 small { display: block; font: italic 400 13px var(--font-es); color: var(--muted); }
.conj-t dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; }
.conj-t dt { color: var(--muted); font: italic 14px var(--font-es); }
.conj-t dd { margin: 0; font: 600 1.02rem var(--font-es); overflow-wrap: anywhere; }
.conj-t dd.hit { color: var(--accent); }

/* ---------- settings ---------- */
.setting { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting > div:first-child { flex: 1 1 240px; min-width: 0; }
.setting b { display: block; }
.setting span { color: var(--muted); font-size: 14px; }
textarea.field { width: 100%; min-height: 110px; font: 12px/1.5 ui-monospace, Menlo, monospace; resize: vertical; }
@media (prefers-reduced-motion: no-preference) { .meter i, .week i { transition: width .3s, height .3s; } }
</style>

<header class="top">
